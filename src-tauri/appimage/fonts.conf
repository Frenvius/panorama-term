<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The WebKit bundled in the AppImage aborts its web process while painting some COLRv1 color
  glyphs (Skia colrv1_configure_skpaint assertion), so hide COLRv1 fonts from it. Emoji fall
  back to the next font the system offers (Noto Emoji on Fedora). Everything else is the
  system's own configuration.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*COLRv1*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
