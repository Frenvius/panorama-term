[package]
name = "panorama"
version = "0.2.12"
description = "Infinite canvas of persistent terminal tiles"
edition = "2021"
license = "MIT"

[lib]
name = "panorama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# the installer kills every process named after the main binary; tauri.conf.json renames it back for bundles
[[bin]]
name = "panorama-dev"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-mcp-bridge = "0.11"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }
