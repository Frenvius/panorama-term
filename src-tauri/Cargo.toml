[package]
name = "panorama"
version = "0.4.15"
description = "Infinite canvas of persistent terminal tiles"
edition = "2021"
license = "MIT"

[lib]
name = "panorama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# the installer kills every process named after the main binary; tauri.conf.json renames it back for bundles
[[bin]]
name = "panorama-dev"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
panorama-runtime = { path = "../sidecar-rs/runtime" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net", "macros", "rt-multi-thread", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_secretbox = "0.1"
sha2 = "0.10"
getrandom = "0.2"
url = "2"
dirs = "6"
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-mcp-bridge = "0.13"
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.crypto_secretbox]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.tungstenite]
opt-level = 3

[profile.dev.package.panorama]
opt-level = 1

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
