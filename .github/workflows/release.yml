name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frontend)
        run: bun install --frozen-lockfile

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sidecar-rs
          shared-key: tauri-release-${{ matrix.target }}

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect bundles
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir out
          case "${{ matrix.platform }}" in
            windows-*)
              cp "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/nsis/*-setup.exe.sig out/
              ;;
            darwin-*)
              ARCH=$([ "${{ matrix.target }}" = x86_64-apple-darwin ] && echo x64 || echo aarch64)
              cp "$BUNDLE"/dmg/*.dmg out/
              cp "$BUNDLE/macos/Panorama.app.tar.gz" "out/Panorama_${VERSION}_${ARCH}.app.tar.gz"
              cp "$BUNDLE/macos/Panorama.app.tar.gz.sig" "out/Panorama_${VERSION}_${ARCH}.app.tar.gz.sig"
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/appimage/*.AppImage.sig "$BUNDLE"/deb/*.deb out/
              ;;
          esac
          ls -la out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | awk 'NF {p=1} p' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi

          tac release-notes.md | awk 'NF {p=1} p' | tac > release-notes.trimmed.md
          mv release-notes.trimmed.md release-notes.md

          echo "::group::Release notes for v$VERSION"
          cat release-notes.md
          echo "::endgroup::"

      - name: Build updater.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/Frenvius/panorama-term/releases/download/v${VERSION}"
          PLATFORMS='{}'
          for dir in bundles/*/; do
            platform=$(basename "$dir")
            sig=$(ls "$dir"*.sig)
            file=$(basename "$sig" .sig)
            PLATFORMS=$(jq --arg p "$platform" --arg url "$BASE/$file" --arg sig "$(cat "$sig")" \
              '. + {($p): {url: $url, signature: $sig}}' <<< "$PLATFORMS")
            rm "$sig"
          done

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat release-notes.md)" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > public/updater.json

          echo "::group::updater.json"
          cat public/updater.json
          echo "::endgroup::"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'Panorama v${{ steps.version.outputs.version }}'
          body_path: release-notes.md
          files: bundles/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updater.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp public/updater.json "$RUNNER_TEMP/updater.json"

          for i in 1 2 3; do
            git fetch origin main || { echo "fetch failed, retrying ($i/3)..."; sleep 2; continue; }
            git checkout -f -B main FETCH_HEAD
            cp "$RUNNER_TEMP/updater.json" public/updater.json
            git add public/updater.json
            git diff --cached --quiet && { echo "updater.json already up to date"; exit 0; }
            git commit -m "chore: update updater.json for v${{ steps.version.outputs.version }}"
            git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i/3)..."
            sleep 2
          done
          echo "Failed to push updater.json after 3 attempts" >&2
          exit 1
