name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: [self-hosted, linux, panorama]
    timeout-minutes: 90
    env:
      TARGET: x86_64-unknown-linux-gnu
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Toolchain path
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install dependencies (frontend)
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: |
          rm -rf "src-tauri/target/$TARGET/release/bundle"
          bun run tauri build --target $TARGET
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Collect bundles
        run: |
          BUNDLE="src-tauri/target/$TARGET/release/bundle"
          rm -rf out
          mkdir out
          cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/appimage/*.AppImage.sig "$BUNDLE"/deb/*.deb out/
          ls -la out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/*
          if-no-files-found: error

  build-windows:
    runs-on: [self-hosted, windows, panorama]
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
      RUSTUP_HOME: C:\panorama\rustup
      CARGO_HOME: C:\panorama\cargo
      BUN_INSTALL: C:\panorama\bun
      BUN_INSTALL_CACHE_DIR: C:\panorama\cache\bun
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Toolchain path
        run: |
          "$env:CARGO_HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "$env:BUN_INSTALL\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install dependencies (frontend)
        run: bun install --frozen-lockfile

      - name: Set up Windows code signing
        run: |
          $simplySign = 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
          if (-not (Test-Path $simplySign)) { throw 'SimplySign Desktop is not installed on this runner' }
          if (-not (Get-Process SimplySignDesktop -ErrorAction SilentlyContinue)) { Start-Process $simplySign }
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\codesign\sign-windows.ps1'
          $config = Join-Path $env:RUNNER_TEMP 'tauri.sign.json'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1') } } } } | ConvertTo-Json -Depth 6 | Set-Content $config
          "TAURI_SIGN_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri app
        run: |
          Remove-Item -Recurse -Force "src-tauri/target/$env:TARGET/release/bundle" -ErrorAction SilentlyContinue
          bun run tauri build --target $env:TARGET --config $env:TAURI_SIGN_CONFIG
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed with exit code $LASTEXITCODE" }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_OTP_URI: ${{ secrets.SIMPLYSIGN_OTP_URI }}

      - name: Verify Windows signatures
        run: |
          $setup = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis/*-setup.exe"
          $extracted = Join-Path $env:RUNNER_TEMP 'nsis-extracted'
          Remove-Item -Recurse -Force $extracted -ErrorAction SilentlyContinue
          &'C:\Program Files\7-Zip\7z.exe' x $setup.FullName "-o$extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($setup.Name)" }
          $files = @($setup) + @(Get-ChildItem $extracted -Recurse -Include *.exe, *.dll -Exclude nsExec.dll)
          $unsigned = foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($signature.Status) | $($signature.SignerCertificate.Subject) | $($file.Name)"
            if ($signature.Status -ne 'Valid') { $file.Name }
          }
          if ($unsigned) { throw "Unsigned binaries: $($unsigned -join ', ')" }

      - name: Collect bundles
        run: |
          $bundle = "src-tauri/target/$env:TARGET/release/bundle/nsis"
          Remove-Item -Recurse -Force out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "$bundle/*-setup.exe", "$bundle/*-setup.exe.sig" out/
          Get-ChildItem out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: out/*
          if-no-files-found: error

  build-macos:
    runs-on: [self-hosted, macOS, panorama]
    env:
      TARGETS: aarch64-apple-darwin x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Toolchain path
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies (frontend)
        run: bun install --frozen-lockfile

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Set up code signing
        run: |
          signing="$HOME/kiwi/signing"
          security unlock-keychain -p "$(cat "$signing/keychain-password")" "$signing/kiwinote-signing.keychain-db"
          notary="$signing/notary"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Felipe Ribeiro (47T2RP8332)" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$(cat "$notary/key-id")" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$(cat "$notary/issuer-id")" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$notary/AuthKey_$(cat "$notary/key-id").p8" >> "$GITHUB_ENV"

      - name: Build Tauri app
        run: |
          for target in $TARGETS; do
            rm -rf "src-tauri/target/$target/release/bundle"
            bun run tauri build --target "$target"
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Notarize DMGs and verify signatures
        run: |
          for target in $TARGETS; do
            bundle="src-tauri/target/$target/release/bundle"
            app="$bundle/macos/Panorama.app"
            dmg=$(ls "$bundle"/dmg/*.dmg)
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -q 'TeamIdentifier=47T2RP8332'
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          done

      - name: Collect bundles
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          rm -rf out
          for target in $TARGETS; do
            bundle="src-tauri/target/$target/release/bundle"
            arch=$([ "$target" = x86_64-apple-darwin ] && echo x64 || echo aarch64)
            dir="out/darwin-${target%%-*}"
            mkdir -p "$dir"
            cp "$bundle"/dmg/*.dmg "$dir/"
            cp "$bundle/macos/Panorama.app.tar.gz" "$dir/Panorama_${VERSION}_${arch}.app.tar.gz"
            cp "$bundle/macos/Panorama.app.tar.gz.sig" "$dir/Panorama_${VERSION}_${arch}.app.tar.gz.sig"
          done
          ls -laR out

      - name: Upload bundles (aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: darwin-aarch64
          path: out/darwin-aarch64/*
          if-no-files-found: error

      - name: Upload bundles (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: darwin-x86_64
          path: out/darwin-x86_64/*
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | awk 'NF {p=1} p' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi

          tac release-notes.md | awk 'NF {p=1} p' | tac > release-notes.trimmed.md
          mv release-notes.trimmed.md release-notes.md

          echo "::group::Release notes for v$VERSION"
          cat release-notes.md
          echo "::endgroup::"

      - name: Build updater.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/Frenvius/panorama-term/releases/download/v${VERSION}"
          PLATFORMS='{}'
          for dir in bundles/*/; do
            platform=$(basename "$dir")
            sig=$(ls "$dir"*.sig)
            file=$(basename "$sig" .sig)
            PLATFORMS=$(jq --arg p "$platform" --arg url "$BASE/$file" --arg sig "$(cat "$sig")" \
              '. + {($p): {url: $url, signature: $sig}}' <<< "$PLATFORMS")
            rm "$sig"
          done

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat release-notes.md)" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > public/updater.json

          echo "::group::updater.json"
          cat public/updater.json
          echo "::endgroup::"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'Panorama v${{ steps.version.outputs.version }}'
          body_path: release-notes.md
          files: bundles/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updater.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp public/updater.json "$RUNNER_TEMP/updater.json"

          for i in 1 2 3; do
            git fetch origin main || { echo "fetch failed, retrying ($i/3)..."; sleep 2; continue; }
            git checkout -f -B main FETCH_HEAD
            cp "$RUNNER_TEMP/updater.json" public/updater.json
            git add public/updater.json
            git diff --cached --quiet && { echo "updater.json already up to date"; exit 0; }
            git commit -m "chore: update updater.json for v${{ steps.version.outputs.version }}"
            git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i/3)..."
            sleep 2
          done
          echo "Failed to push updater.json after 3 attempts" >&2
          exit 1
